# Waybar-specific
layerrule = blur on, ignore_alpha 0.3, match:namespace waybar

# Monitor config
$monitor = DP-2
monitor = $monitor, 3440x1440@174.96Hz, auto, 1.0, bitdepth, 10

# enable hdr:
# monitor = $monitor, 3440x1440@174.96Hz, auto, 1.0, bitdepth, 10, cm, hdr, sdrbrightness, 1.1, sdrsaturation, 1.1

# Programs
$browser = zen-browser
$terminal = ghostty
$filemanager = dolphin
$menu = wofi --show drun

# Environment variables for Wayland app compatibility
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11

# Autostart apps
exec-once = waybar & swaync &
exec-once = swww-daemon &
exec-once = waypaper --restore &
exec-once = hyprctl setcursor Nordzy-cursor 24

# ----------
# Window rules
# ----------

# Make everything in workspace 3 float
windowrule = match:workspace 3, float on

# Steam — workspace 3 is all-floating (see rule above), so no extra float rule needed
windowrule = match:class ^(steam)$, workspace 3 silent
workspace = 3, layout:floating

# Steam Games
windowrule = match:class ^steam_app_\d+$, fullscreen on
windowrule = match:class ^steam_app_\d+$, workspace 10
windowrule = match:class ^steam_app_\d+$, immediate on
workspace = 10, border:false, rounding:false
# windowrule = match:class ^steam_app_\d+$, monitor $monitor

# ----------
# Input
# ----------

input {
    kb_layout = gb

    follow_mouse = 1
    mouse_refocus = false
    sensitivity = -0.25
    accel_profile = flat

    touchpad {
        natural_scroll = no
    }
}

# ----------
# General
# ----------

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(d65d0ed9)
    col.inactive_border = rgba(3c3836dd)
    layout = dwindle
}

# ----------
# Decoration
# ----------

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.98

    blur {
        enabled = true
        size = 8
        xray = true
        new_optimizations = on
        brightness = 0.8
        contrast = 0.9
        noise = 0.01
        passes = 2
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 20
        offset = 5 5
        render_power = 3
        ignore_window = true
        scale = 0.97
        color = rgba(0, 0, 0, 0.5)
    }
}

# ----------
# Animations
# ----------

animations {
    enabled = yes
    bezier = myCurve, 0.16, 1, 0.3, 1
    animation = windows, 1, 7, myCurve
    animation = windowsOut, 1, 7, myCurve
    animation = border, 1, 10, default
    animation = fade, 1, 10, default
    animation = workspaces, 1, 6, default
}

# ----------
# Dwindle
# ----------

dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
}

# ----------
# Misc
# ----------

misc {
    vfr = true                          # only render frames when something changes
    vrr = 1                             # variable refresh rate (FreeSync/G-Sync)
    mouse_move_enables_dpms = true      # wake screen on mouse movement
    key_press_enables_dpms = true       # wake screen on keypress
    focus_on_activate = false           # prevent apps stealing focus
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ----------
# Render
# ----------

render {
    direct_scanout = true               # fullscreen apps bypass compositor
}

# ----------
# Keybinds
# ----------
source = ~/.config/hypr/conf/keybinds.conf
