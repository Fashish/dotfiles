background {
    path = /home/fador/Pictures/Wallpapers/wallhaven-gruvbox.png
    blur_size = 4
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

# Hours
label {
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgba(d79921ff) # Gruvbox yellow
    font_size = 112
    font_family = Book Antiqua 10
    shadow_passes = 3
    shadow_size = 4
    position = 0, 220
    halign = center
    valign = center
}

# Minutes
label {
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(d79921ff)
    font_size = 112
    font_family = Book Antiqua 10
    shadow_passes = 3
    shadow_size = 4
    position = 0, 80
    halign = center
    valign = center
}

# Day
label {
    text = cmd[update:18000000] echo "<b><big> $(date +'%A') </big></b>"
    color = rgba(ebdbb2ff)
    font_size = 22
    font_family = JetBrainsMono Nerd Font 10
    position = 0, 0
    halign = center
    valign = center
}

# Date
label {
    text = cmd[update:18000000] echo "<b> $(date +'%d %b') </b>"
    color = rgba(ebdbb2ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font 10
    position = 0, -30
    halign = center
    valign = center
}

# Weather / Temp
label {
    text = cmd[update:18000000] echo "<b>Feels like<big> $(curl -s 'wttr.in?format=%t' | tr -d '+') </big></b>"
    color = rgba(ebdbb2ff)
    font_size = 18
    font_family = Book Antiqua 10
    position = 0, 40
    halign = center
    valign = bottom
}

input-field {
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rouding = -1
    rounding = 22
    outer_color = rgba(3c3836ff)     # Gruvbox dark2
    inner_color = rgba(282828ff)     # Gruvbox background
    font_color = rgba(d79921ff)      # Gruvbox yellow
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, 120
    halign = center
    valign = bottom
}

# Current Song
label {
    text = cmd[update:1000] echo "$(~/.config/hypr/bin/songdetail.sh)" 
    color = rgba(b8bb26ff)           # Gruvbox green
    shadow_passes = 3
    shadow_size = 1
    font_size = 18
    font_family = DM Sans
    position = 0, 400
    halign = center
    valign = bottom
}
