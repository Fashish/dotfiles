# Monitor config
$monitor = DP-2
# SDR
monitor = $monitor, 3440x1440@175, auto, 1.0, bitdepth, 10
# HDR
# monitor = $monitor, 3440x1440@175, auto, 1.0, bitdepth, 10, cm, hdr, sdrbrightness, 1.1, sdrsaturation, 1.1

# Programs
$browser = zen-browser
$terminal = ghostty
$filemanager = dolphin
$menu = walker

# Environment variables for Wayland app compatibility
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_STYLE_OVERRIDE,kvantum
env = GDK_BACKEND,wayland,x11

# Cursor — Bibata Gruvbox (XCursor + Hyprcursor native)
env = XCURSOR_THEME,Bibata-Modern-Classic-Gruvbox
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Classic-Gruvbox
env = HYPRCURSOR_SIZE,24

# Autostart apps
exec-once = waybar &
exec-once = swaync &
exec-once = hypridle &
exec-once = awww-daemon &
exec-once = sleep 1 && awww img ~/Pictures/Wallpapers/wallhaven-gruvbox.png &
exec-once = elephant &
exec-once = walker --gapplication-service &
exec-once = hyprctl setcursor Bibata-Modern-Classic-Gruvbox 24
exec-once = wl-paste --type text  --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &
exec-once = udiskie --no-automount --smart-tray &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 &
exec-once = easyeffects --gapplication-service &

# ----------
# Window rules
# ----------

# Make everything in workspace 3 float
windowrule = match:workspace 3, float on

# Steam — workspace 3 is all-floating (see rule above), so no extra float rule needed
windowrule = match:class ^(steam)$, workspace 3 silent
workspace = 3, layout:floating

# Steam Games
windowrule = match:class ^steam_app_\d+$, fullscreen on
windowrule = match:class ^steam_app_\d+$, workspace 10
windowrule = match:class ^steam_app_\d+$, immediate on
workspace = 10, border:false, rounding:false
# windowrule = match:class ^steam_app_\d+$, monitor $monitor

# ----------
# Input
# ----------

input {
    kb_layout = gb

    follow_mouse = 1
    mouse_refocus = false
    sensitivity = -0.25
    accel_profile = flat

    touchpad {
        natural_scroll = no
    }
}

cursor {
    no_hardware_cursors = true
    enable_hyprcursor = true
}

# ----------
# General
# ----------

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(d65d0e80) rgba(fe801980) 45deg
    col.inactive_border = rgba(3c383680)
    layout = dwindle
}

# ----------
# Decoration
# ----------

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.98

    blur {
        enabled = true
        size = 8
        xray = true
        new_optimizations = on
        brightness = 0.8
        contrast = 0.9
        noise = 0.01
        passes = 2
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 20
        offset = 5 5
        render_power = 3
        scale = 0.97
        color = rgba(00000080)
    }
}

# ----------
# Animations
# ----------

animations {
    enabled = yes
    bezier = myCurve, 0.16, 1, 0.3, 1
    animation = windows, 1, 7, myCurve
    animation = windowsOut, 1, 7, myCurve
    animation = border, 1, 10, default
    animation = fade, 1, 10, default
    animation = workspaces, 1, 6, default
}

# ----------
# Dwindle
# ----------

dwindle {
    preserve_split = yes
}

master {
    new_status = master
}

# ----------
# Misc
# ----------

misc {
    vrr = 0                             # disabled: caused screen jittering on AW3423DW
    mouse_move_enables_dpms = true      # wake screen on mouse movement
    key_press_enables_dpms = true       # wake screen on keypress
    focus_on_activate = false           # prevent apps stealing focus
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ----------
# Render
# ----------

render {
    direct_scanout = true               # fullscreen apps bypass compositor
}

# ----------
# Keybinds
# ----------
source = ~/.config/hypr/conf/keybinds.conf
