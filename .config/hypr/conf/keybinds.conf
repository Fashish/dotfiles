# ----------
# Keybinds
# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# ----------

$ss = SUPER_SHIFT

# Keybindings
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, Q, killactive,
bind = SUPER, space, exec, $menu
bind = SUPER, F, fullscreen
bind = SUPER, B, exec, $browser
bind = SUPER, V, togglefloating
bind = SUPER, E, exec, $filemanager
bind = SUPER, Y, exec, ghostty -e yazi
bind = SUPER, X, exec, ~/.config/hypr/bin/session-menu.sh
bind = SUPER, ESCAPE, exec, loginctl terminate-session "$XDG_SESSION_ID"
bind = SUPER, S, exec, steam

# Move focus (vim-style)
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, L, exec, hyprlock

# Switch to workspace 1–9
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move focused window to a workspace
bind = $ss, 1, movetoworkspacesilent, 1
bind = $ss, 2, movetoworkspacesilent, 2
bind = $ss, 3, movetoworkspacesilent, 3
bind = $ss, 4, movetoworkspacesilent, 4
bind = $ss, 5, movetoworkspacesilent, 5
bind = $ss, 6, movetoworkspacesilent, 6
bind = $ss, 7, movetoworkspacesilent, 7
bind = $ss, 8, movetoworkspacesilent, 8
bind = $ss, 9, movetoworkspacesilent, 9
bind = $ss, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindows

# Screenshots — saves to ~/Pictures/Screenshots/ AND copies to clipboard
# $ss+W: full monitor
# $ss+S: region
bind = $ss, W, exec, ~/.config/hypr/bin/screenshot.sh output
bind = $ss, S, exec, ~/.config/hypr/bin/screenshot.sh region

# HDR toggle
bind = $ss, H, exec, ~/.config/hypr/bin/hdr-toggle.sh

# Volume up / down / mute
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Media keys — Super-prefixed (avoids F7/F8/F9 conflicts with apps)
# Signal 15 refreshes waybar's custom/musiccontroller widget
bind = SUPER, F7, exec, playerctl -a previous ; pkill -RTMIN+15 waybar
bind = SUPER, F8, exec, playerctl -a play-pause ; pkill -RTMIN+15 waybar
bind = SUPER, F9, exec, playerctl -a next ; pkill -RTMIN+15 waybar

