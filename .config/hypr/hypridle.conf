# `hyprctl dispatch` evaluates its argument as Lua under a Lua Hyprland config.
# The old `dispatch dpms off` form fails with exit 7 and the panel never sleeps,
# which on this QD-OLED panel is a burn-in risk — keep these in Lua form.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# No dim-before-lock listener: this is a desktop, and `brightnessctl -l` reports no
# backlight-class device (the AW3423DW is driven over DP). The DPMS-off listener below
# handles turning the panel off, which is what matters for OLED burn-in anyway.

listener {
    timeout = 300                                 # 5min
    on-timeout = hyprlock                         # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'   # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'     # screen on when activity is detected
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}