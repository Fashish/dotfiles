# Under a Lua Hyprland config, `hyprctl dispatch` evaluates its argument as Lua,
# so the old `dispatch dpms off` form fails (exit 7) and the panel never sleeps.
# The `||` fallback keeps these working under either config format, so rolling
# back to hyprland.conf does not silently break DPMS again.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' || hyprctl dispatch dpms on
}

# No dim-before-lock listener: this is a desktop, and `brightnessctl -l` reports no
# backlight-class device (the AW3423DW is driven over DP). The DPMS-off listener below
# handles turning the panel off, which is what matters for OLED burn-in anyway.

listener {
    timeout = 300                                 # 5min
    on-timeout = hyprlock                         # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })' || hyprctl dispatch dpms off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' || hyprctl dispatch dpms on
}

listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}